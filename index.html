<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾光造梦局 · The Museum of Lost Light</title>
<style>
:root{--night:#0b1020;--mist:#192c43;--gold:#d8a96b;--moon:#e9e4d9;--dust:#8b9fae}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:var(--moon);font-family:Georgia,'Noto Serif SC','Songti SC',serif}body{user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:28px;right:28px;top:22px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.18em;font-size:12px;color:#aab5bd}
.brand{opacity:.75}.actions{display:flex;gap:10px;pointer-events:auto}.icon{width:40px;height:40px;border:1px solid #8b9fae38;border-radius:50%;background:#0b102088;color:var(--moon);cursor:pointer;transition:.3s}.icon:hover{border-color:#d8a96b99;color:var(--gold);transform:translateY(-2px)}
#worldClock{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center;color:#d8a96b;letter-spacing:.2em;font:18px Georgia,serif;text-shadow:0 0 15px #d8a96b88}#worldClock small{display:block;color:#7f929f;font:8px Arial,sans-serif;letter-spacing:.3em;margin-bottom:3px}
#stars{display:flex;gap:8px}.star{color:#596879;font-size:15px;text-shadow:none}.star.on{color:#edc889;text-shadow:0 0 12px #d8a96b}
#title{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 48%,#15233c22,transparent 43%);transition:opacity 1.2s;pointer-events:auto}.title-inner{margin-top:1vh}.sigil{width:76px;height:76px;margin:auto;border:1px solid #d8a96b88;border-radius:50%;display:grid;place-items:center;color:#f0cc91;font-size:28px;box-shadow:0 0 40px #d8a96b26,inset 0 0 28px #d8a96b18;animation:breathe 3s ease-in-out infinite}
h1{font-weight:400;font-size:clamp(28px,5vw,58px);letter-spacing:.42em;margin:34px 0 12px;padding-left:.42em;text-shadow:0 0 25px #b9d9ff33}.en{font:11px Arial,sans-serif;letter-spacing:.55em;color:#9daebb;margin-bottom:28px}.tag{font-size:14px;letter-spacing:.28em;color:#b7bdc1}.enter{margin-top:48px;border:0;border-bottom:1px solid #d8a96b77;padding:13px 20px;background:transparent;color:#e8d7bb;font:14px Georgia,serif;letter-spacing:.18em;cursor:pointer;transition:.3s}.enter:hover{color:#fff;border-color:#f5d59d;text-shadow:0 0 13px #d8a96b}
#copy{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:min(740px,84vw);text-align:center;transition:opacity .7s}.chapter{font:10px Arial,sans-serif;letter-spacing:.35em;color:#d8a96b;margin-bottom:10px}.name{font-size:clamp(22px,3vw,34px);letter-spacing:.22em}.poem{font-size:14px;letter-spacing:.12em;color:#b9c3c9;margin-top:13px;line-height:1.8}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font:11px Arial,sans-serif;letter-spacing:.14em;color:#8796a1;text-align:center;white-space:nowrap}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,88vw);padding:34px 30px;background:#08101de6;border:1px solid #9ba9b625;backdrop-filter:blur(16px);text-align:center;pointer-events:auto;display:none;box-shadow:0 30px 100px #0009}.panel-title{font-size:24px;letter-spacing:.22em;margin:0 0 12px}.panel-text{font-size:13px;line-height:2;color:#aeb8be;letter-spacing:.08em}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:23px}.level{min-height:76px;border:1px solid #8b9fae2e;background:#ffffff05;color:#c6cbd0;cursor:pointer;font:12px Georgia,serif;transition:.25s}.level:hover:not(:disabled){border-color:#d8a96b99;color:#edc889;transform:translateY(-3px)}.level:disabled{opacity:.28;cursor:not-allowed}.level b{display:block;font:18px Arial;margin-bottom:8px;color:#d8a96b}.close{margin-top:24px;background:none;border:0;color:#99a5ad;cursor:pointer;letter-spacing:.2em}
.memory-actions{display:flex;justify-content:center;gap:10px;margin-top:18px}.memory-actions button,.choice{border:1px solid #d8a96b55;background:#d8a96b0a;color:#dfc79e;padding:11px 16px;font:12px Georgia,serif;letter-spacing:.12em;cursor:pointer}.memory-actions button:disabled{opacity:.25}.choices{display:flex;justify-content:center;gap:18px;margin-top:25px}.choice{min-width:190px;padding:18px}.choice:hover{background:#d8a96b1c;border-color:#d8a96b}
#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);padding:11px 18px;border:1px solid #d8a96b44;background:#091221df;color:#e7d5b6;font-size:12px;letter-spacing:.16em;opacity:0;transition:.45s}.show{opacity:1!important;transform:translate(-50%,0)!important}
.fade{opacity:0!important;pointer-events:none!important}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 62px #d8a96b45,inset 0 0 36px #d8a96b2b}}
@media(max-width:650px){.top{left:14px;right:14px;top:12px}.brand{display:none}.levels{grid-template-columns:repeat(3,1fr)}#copy{bottom:48px}.name{font-size:20px}.poem{font-size:12px}.actions{gap:6px}.icon{width:36px;height:36px}}
</style>
</head>
<body>
<canvas id="game" aria-label="拾光造梦局互动游戏"></canvas><input id="typer" autocomplete="off" autocapitalize="off" aria-label="输入记忆文字" style="position:fixed;left:-9999px;opacity:0">
<div id="ui"><div class="top"><div class="brand">THE MUSEUM OF LOST LIGHT · 05:20</div><div id="worldClock"><small>WORLD CLOCK</small><span>00:00</span></div><div id="stars"></div><div class="actions"><button class="icon" id="sound" title="开启声音">♪</button><button class="icon" id="menu" title="藏品目录">☰</button></div></div>
<div id="title"><div class="title-inner"><div class="sigil">✦</div><h1>拾 光 造 梦 局</h1><div class="en">THE MUSEUM OF LOST LIGHT</div><div class="tag">在世界睡着以后，替它找回遗失的光。</div><button class="enter" id="enter">进入博物馆 · Enter</button></div></div>
<div id="copy"></div><div id="hint"></div><div id="toast"></div>
<div id="panel"><h2 class="panel-title">记 忆 回 廊</h2><div class="panel-text">每一件被修复的记忆，都会让世界向 05:20 靠近。</div><div class="levels" id="levels"></div><div class="memory-actions"><button id="postcard">保存最新明信片</button><button id="finale">重返日出之前</button><button id="restart">重新开始</button></div><button class="close" id="close">返回展厅</button></div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),X=C.getContext('2d'),title=$('title'),copy=$('copy'),hint=$('hint'),toast=$('toast'),panel=$('panel'),starsEl=$('stars'),worldClock=$('worldClock').querySelector('span');
localStorage.removeItem('lostLightSolved');localStorage.removeItem('lostLightEndings');
const TAU=Math.PI*2,S={scene:'title',level:0,solved:0,sound:localStorage.lostLightSound==='1',endings:0,t:0,fade:0};
let W=0,H=0,D=1,m={x:0,y:0,down:false,last:0},particles=[],ripples=[],trail=[],audio=null,idle=0,butterfly=0,lumi={x:0,y:0};
const poems=['有些光并没有熄灭，只是忘记了回家的方向。','夏天从来没有离开，它只是躲进了一只小小的玻璃瓶。','有些事情无法回到过去，但我们仍然可以决定怎样走向明天。','每一朵沉默的花，都记得属于自己的歌。','你拾起的每一点微光，都在等待同一片天空。'];
const names=['最后一盏路灯','装着夏天的瓶子','清晨五点二十分','不会唱歌的花','最后一颗晨星'];
const hints=['依次调整四面镜子，将月光引向最后一盏路灯','键入屏幕上的句子，让字母化作萤火回到瓶中','观察四个时间节点，在正确时刻取信、扶杯并投信','记住花瓣的闪烁，依次敲响玻璃音铃','按记忆顺序连接五件藏品，再环绕核心编织晨星'];
const L={};
function $(id){return document.getElementById(id)}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)} addEventListener('resize',resize);resize();
function tone(f=440,d=.2,type='sine',v=.05,delay=0){if(!S.sound)return;if(!audio)audio=new(window.AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start(n);o.stop(n+d+.03)}
function chime(){[262,330,392,523,659].forEach((f,i)=>tone(f,.8,'sine',.045,i*.09))}
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1900)}
function sparkle(x,y,n=12,col='#d8a96b'){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*2.2,vy:(Math.random()-.5)*2.2,a:1,r:Math.random()*2+1,col,life:1})}
function setCopy(level){copy.innerHTML=level?`<div class="chapter">CHAPTER 0${level}</div><div class="name">${names[level-1]}</div><div class="poem">“${poems[level-1]}”</div>`:'';hint.textContent=level?hints[level-1]:''}
function updateStars(){starsEl.innerHTML='';for(let i=0;i<S.solved;i++){let e=document.createElement('span');e.className='star on';e.textContent='✦';e.title='第 '+(i+1)+' 颗晨星';starsEl.append(e)}let mins=Math.min(320,S.solved*64);worldClock.textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function buildMenu(){let d=$('levels');d.innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.className='level';b.disabled=i>S.solved;b.innerHTML=`<b>0${i+1}</b>${n}`;b.onclick=()=>{panel.style.display='none';startLevel(i+1)};d.append(b)});$('postcard').disabled=S.solved<1;$('finale').disabled=S.solved<5}updateStars();buildMenu();
function goHub(){S.scene='hub';S.level=0;setCopy(0);hint.textContent=S.solved>=5?'五颗晨星已经归位 · 可从记忆回廊进入终章':'点击发光的藏品，进入下一段记忆';initHub()}
function startLevel(n){S.scene='level';S.level=n;setCopy(n);copy.style.opacity=1;initLevel(n);setTimeout(()=>copy.style.opacity=.12,3300)}
function initHub(){L.orbs=[[-220,-10],[-110,45],[0,-5],[110,45],[220,-10]]}
function initLevel(n){trail=[];L.solving=false;L.activeMirror=-1;if(n===1)L.mirrors=[-.7,.45,-.45,.75];if(n===2){L.target='The Museum Of Lost Light';L.typed='';L.typeIndex=0;L.wrong=0;setTimeout(()=>{$('typer').value='';$('typer').focus()},80)}if(n===3){L.clock=0;L.letter=false;L.cup=false;L.mailed=false;L.lastObject=''}if(n===4){L.seq=[0,3,1,4,2];L.input=[];L.show=-1;L.showStep=0;L.next=performance.now()+600;L.ready=false}if(n===5){L.phase=0;L.order=[0,2,4,1,3];L.awake=[];L.core=0}}
function solve(){if(S.scene!=='level')return;chime();sparkle(W/2,H/2,90,'#f2cc82');S.scene='solved';let n=S.level;if(n>S.solved){S.solved=n;localStorage.lostLightSolved=S.solved;updateStars();buildMenu()}copy.style.opacity=1;if(n===3)copy.innerHTML='<div class="chapter">MEMORY RESTORED · 05:20</div><div class="name">有些事情无法回到过去。</div><div class="poem">但我们仍然可以决定，怎样走向明天。</div>';hint.textContent='记忆已经归位 · 点击返回展厅';setTimeout(()=>say('一颗新的晨星，回到了夜空'),500);if(n===3)setTimeout(()=>say('博物馆深处传来声音：“请不要让太阳升起。”'),2500)}
function pos(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
C.addEventListener('pointermove',e=>{let p=pos(e),dx=p.x-m.x,dy=p.y-m.y;m.x=p.x;m.y=p.y;idle=0;for(let i=0;i<Math.min(3,Math.ceil(Math.hypot(dx,dy)/8));i++)particles.push({x:m.x,y:m.y,vx:-dx*.025+(Math.random()-.5)*.2,vy:-dy*.025+(Math.random()-.5)*.2,a:.5,r:Math.random()*1.4+.4,col:'#d8a96b',life:1});if(m.down)drag(dx,dy)});
C.addEventListener('pointerdown',e=>{let p=pos(e);m.x=p.x;m.y=p.y;m.down=true;C.setPointerCapture(e.pointerId);idle=0;if(S.scene==='hub'&&S.solved>=5&&Math.hypot(p.x-W/2,p.y-H*.79)<64){startFinale();ripples.push({x:p.x,y:p.y,r:2,a:.65});chime();return}if(S.scene==='level'&&S.level===1){let pts=mirrorPts();L.activeMirror=pts.findIndex(q=>Math.hypot(m.x-q.x,m.y-q.y)<58)}click(p);ripples.push({x:m.x,y:m.y,r:2,a:.65});tone(680,.22,'sine',.035)});C.addEventListener('pointerup',()=>{m.down=false;L.activeMirror=-1});
function typeMemory(key){if(S.scene!=='level'||S.level!==2||L.solving)return;while(L.target[L.typeIndex]===' '){L.typed+=' ';L.typeIndex++}let expected=L.target[L.typeIndex];if(key.toLowerCase()===expected.toLowerCase()){L.typed+=expected;L.typeIndex++;while(L.target[L.typeIndex]===' '){L.typed+=' ';L.typeIndex++}L.wrong=0;tone(360+L.typeIndex*12,.2,'sine',.045);sparkle(W/2+(Math.random()-.5)*190,H*.43,9);if(L.typeIndex>=L.target.length){L.solving=true;chime();setTimeout(solve,650)}}else{L.wrong++;tone(145,.2,'triangle',.03);say('下一个字母是 '+expected.toUpperCase())}}
addEventListener('keydown',e=>{if(S.scene==='level'&&S.level===2&&/^[a-z]$/i.test(e.key)){e.preventDefault();typeMemory(e.key)}});
$('typer').addEventListener('input',e=>{if(S.scene==='level'&&S.level===2&&e.data&&/[a-z]/i.test(e.data))typeMemory(e.data.slice(-1));e.target.value=''});
function drag(dx,dy){if(S.scene!=='level')return;let n=S.level;if(n===1&&L.activeMirror>=0){let p=mirrorPts()[L.activeMirror];L.mirrors[L.activeMirror]=Math.atan2(m.y-p.y,m.x-p.x)}if(n===3){L.clock=Math.max(0,Math.min(1,(m.x-W*.25)/(W*.5)));if(L.clock>.975&&L.cup&&L.mailed&&!L.solving){L.solving=true;setTimeout(solve,600)}}if(n===5&&L.phase===1&&Math.hypot(m.x-W/2,m.y-H*.46)<170){L.core=Math.min(1,L.core+Math.hypot(dx,dy)/750);if(L.core>=1&&!L.solving){L.solving=true;setTimeout(solve,650)}}}
function click(p){if(S.scene==='prologue'){goHub();return}if(S.scene==='ending'){goHub();return}if(S.scene==='endingChoice'){if(p.y>H*.48&&p.y<H*.7){if(p.x<W/2)chooseEnding(1);else chooseEnding(2)}return}if(S.scene==='solved'){goHub();return}if(S.scene==='hub'){L.orbs.forEach((o,i)=>{let x=W/2+o[0],y=H/2+o[1];if(Math.hypot(p.x-x,p.y-y)<52&&i<=S.solved)startLevel(i+1)})}if(S.scene!=='level')return;if(S.level===2){$('typer').focus();return}if(S.level===3){let mins=280+Math.round(L.clock*40),near=(x,y,r=55)=>Math.hypot(p.x-x,p.y-y)<r;if(Math.abs(mins-295)<=2&&near(W*.63,H*.47)){L.letter=true;L.lastObject='letter';say('你在 04:55 取走了写好的信');tone(523,.4)}else if(Math.abs(mins-310)<=2&&near(W*.34,H*.49)){L.cup=true;L.lastObject='cup';say('你在杯子倾倒前扶住了它');tone(620,.4)}else if(L.letter&&L.cup&&Math.abs(mins-310)<=3&&near(W*.76,H*.4)){L.mailed=true;say('信终于找到了通往清晨的方向');chime()}else if(near(W*.63,H*.47)){say(L.lastObject==='cup'?'原来等待，也是一种时间。':'时间没有回答这封信。')}if(mins>=319&&L.cup&&L.mailed&&!L.solving){L.solving=true;setTimeout(solve,600)}}if(S.level===4&&L.ready){let xs=[-160,-80,0,80,160],k=xs.findIndex(x=>Math.hypot(p.x-(W/2+x),p.y-H*.56)<34);if(k>=0){tone(330+k*75,.5,'sine',.06);sparkle(W/2+xs[k],H*.56,9,['#91b8cf','#b2a0cf','#d8a96b','#d48f86','#9bc6ab'][k]);L.input.push(k);let q=L.input.length-1;if(L.seq[q]!==k){L.input=[];say('花儿轻轻摇头，再听一次');L.show=-1;L.showStep=0;L.ready=false;L.next=performance.now()+700}else if(L.input.length===L.seq.length)setTimeout(solve,500)}}if(S.level===5){let pts=starNodes(),k=pts.findIndex(q=>Math.hypot(p.x-q.x,p.y-q.y)<38);if(L.phase===0&&k>=0){let expected=L.order[L.awake.length];if(k===expected){L.awake.push(k);tone(360+L.awake.length*70,.35);sparkle(p.x,p.y,15);if(L.awake.length===5){L.phase=1;say('五段记忆已相连 · 环绕核心编织晨光')}}else{L.awake=[];say('记忆的顺序散开了，再观察编号')}}}}
function startFinale(){S.scene='endingChoice';setCopy(0);hint.textContent='终章 · 日出之前';copy.style.opacity=1;copy.innerHTML='<div class="chapter">FINAL CHAPTER · BEFORE SUNRISE</div><div class="name">博物馆一直在阻止时间前进。</div><div class="poem">一旦太阳升起，记忆将回到世界，博物馆与小光也会消失。<br>你愿意为了留住美好，让世界永远停在夜晚吗？</div>'}
function chooseEnding(n){S.endings|=n;localStorage.lostLightEndings=S.endings;S.ending=n;S.scene='ending';hint.textContent='点击返回博物馆 · 可在记忆回廊重温选择';copy.innerHTML=n===1?'<div class="chapter">ENDING A · 黎明</div><div class="name">告别不是失去，而是让光继续旅行。</div><div class="poem">小光最后一次绕着你飞行，随后化作世界的第一束晨光。</div>':'<div class="chapter">ENDING B · 永夜</div><div class="name">有些星星很美，只因为我们还没有学会告别。</div><div class="poem">博物馆仍在发光，小光仍然陪伴着你，而窗外永远停在日出之前。</div>';chime();sparkle(W/2,H/2,140,n===1?'#ffd59a':'#91b8cf')}
function bg(){let g=X.createRadialGradient(W*.5,H*.45,20,W*.5,H*.45,Math.max(W,H)*.72);g.addColorStop(0,'#172a42');g.addColorStop(.48,'#0b1428');g.addColorStop(1,'#040711');X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<95;i++){let x=(i*197.3+S.t*2*(i%3===0))%W,y=(i*i*17.1)%H,a=.15+(i%7)/18;X.fillStyle=`rgba(220,232,235,${a})`;X.fillRect(x,y,i%11===0?1.8:.8,i%11===0?1.8:.8)}}

$('restart').onclick=()=>{localStorage.removeItem('lostLightSolved');localStorage.removeItem('lostLightEndings');S.solved=0;S.endings=0;S.level=0;S.scene='title';panel.style.display='none';copy.innerHTML='';hint.textContent='';particles=[];ripples=[];trail=[];updateStars();buildMenu();title.style.display='grid';requestAnimationFrame(()=>title.classList.remove('fade'))};
$('finale').onclick=()=>{if(S.solved>=5){panel.style.display='none';startFinale()}};
$('postcard').onclick=()=>{if(!S.solved)return;let pc=document.createElement('canvas'),q=pc.getContext('2d'),n=Math.min(5,S.solved);pc.width=1200;pc.height=720;let g=q.createLinearGradient(0,0,1200,720);g.addColorStop(0,'#081020');g.addColorStop(1,'#223c52');q.fillStyle=g;q.fillRect(0,0,1200,720);for(let i=0;i<90;i++){q.fillStyle=`rgba(233,228,217,${.15+(i%6)*.08})`;q.fillRect((i*137)%1200,(i*i*29)%720,i%8?1:2,i%8?1:2)}let rg=q.createRadialGradient(600,300,0,600,300,220);rg.addColorStop(0,'#d8a96b88');rg.addColorStop(1,'#d8a96b00');q.fillStyle=rg;q.beginPath();q.arc(600,300,220,0,TAU);q.fill();q.textAlign='center';q.fillStyle='#e9e4d9';q.font='42px Georgia';q.fillText(names[n-1],600,315);q.fillStyle='#d8a96b';q.font='18px Arial';q.fillText('MEMORY 0'+n+' · WORLD CLOCK '+worldClock.textContent,600,375);q.fillStyle='#bdc7ca';q.font='24px Georgia';q.fillText('“'+poems[n-1]+'”',600,500);q.font='16px Arial';q.fillText('THE MUSEUM OF LOST LIGHT · 拾光造梦局',600,645);let a=document.createElement('a');a.download='拾光造梦局-记忆明信片-0'+n+'.png';a.href=pc.toDataURL('image/png');a.click();say('记忆明信片已生成')};
setInterval(()=>{if(S.scene==='solved')hint.textContent='记忆已经归位 · 点击返回展厅'},120);
})();
